quarkus.application.name=bff-cuentas
quarkus.http.root-path=/v1

# Clientes REST salientes. Estas tres líneas son las que permiten deducir
# el destino real de cada llamada sin analizar el código.
quarkus.rest-client.customer-api.url=http://ms-customer.negocio.svc.cluster.local:8080
quarkus.rest-client.customer-api.scope=jakarta.inject.Singleton
quarkus.rest-client.saldos-api.url=${SALDOS_URL:http://ms-saldos.negocio.svc.cluster.local:8080}

# Caché
quarkus.redis.hosts=redis://redis-cuentas.experiencia.svc.cluster.local:6379
quarkus.redis.timeout=3s

# Mensajería
kafka.bootstrap.servers=kafka-0.datos.svc.cluster.local:9092
mp.messaging.outgoing.cuentas-consultadas.connector=smallrye-kafka
mp.messaging.outgoing.cuentas-consultadas.topic=cuentas.consultadas
mp.messaging.incoming.cuentas-actualizadas.connector=smallrye-kafka
mp.messaging.incoming.cuentas-actualizadas.topic=cuentas.actualizadas

quarkus.log.level=INFO
